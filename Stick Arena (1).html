<html lang="ru"><head><meta charset="utf-8">

<title>Stick Arena</title>

<style>

.box{margin:auto;width:100%;max-width:880px}

.bt,.ch,select,.ks button{font:inherit;border:2px solid #000;border-radius:10px;background:var(--pn);color:var(--tx);padding:9px 14px;cursor:pointer;box-shadow:0 3px 0 #000}

.mn{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:20px}

:root{--ink:#17141c;--pp:#f4ecd6;--ac:#ffcf3a;--rd:#ff4d5e;--gr:#4ade80}

#menu h1{text-align:left;color:#fff;font-size:clamp(46px,9vw,110px);transform:rotate(-3deg);text-shadow:5px 5px 0 var(--rd),10px 10px 0 #000}
#menu p{margin:10px 0 0;font-size:21px;color:#ffeab0;text-align:left}
.mn{align-items:flex-start}
.sc:not(#menu) h1{color:var(--ink);text-shadow:4px 4px 0 var(--ac)}
h2{color:var(--ink);font-size:17px;margin:22px 0 10px;text-transform:none;letter-spacing:0;display:flex;gap:10px;align-items:center}

.bt,.ch,.ks button,.pn,.mc,.wc{border:3px solid var(--ink);border-radius:14px 5px 13px 6px/6px 13px 5px 14px;background:#fff;color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.bt:hover,.ch:hover{transform:translate(-1px,-2px) rotate(-.6deg)}
.bt:active,.ch:active{transform:translate(3px,3px);box-shadow:none}
.bt.big{background:var(--ac);font-size:24px;padding:14px 38px}
.ch.on{background:var(--ac)}
.ch.s{padding:4px 10px;font-size:16px;box-shadow:2px 2px 0 var(--ink)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.mc{position:relative;padding:8px 8px 4px;cursor:pointer;text-align:center;transition:.15s;filter:grayscale(.9);opacity:.72}
.mc:nth-child(odd){transform:rotate(-1.3deg)}.mc:nth-child(even){transform:rotate(1.1deg)}
.mc:hover{opacity:.95}
.mc.on{filter:none;opacity:1;background:#fffbe6}
.mc.on::after{content:'✓';position:absolute;right:-10px;top:-12px;background:var(--gr);border:3px solid var(--ink);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:700}
.mc::before{content:'';position:absolute;left:38%;top:-11px;width:24%;height:18px;background:#ffe29aaa;border:1px solid #0002;transform:rotate(-3deg)}
.mc img{width:100%;display:block;border:2px solid var(--ink);border-radius:4px;aspect-ratio:16/9}
.mc span{font-family:'Russo One',Impact,sans-serif;font-size:15px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pn{display:flex;gap:12px;align-items:flex-start;background:#fffdf6;padding:14px;min-width:0;flex:none}
.pn>div{flex:1;min-width:0}
.pv{width:96px;flex:none}
.sw i{border:3px solid var(--ink)}
.ks button{padding:5px 8px;font-size:15px;box-shadow:2px 2px 0 var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:center}
.ks button b{background:var(--ink);color:#fff;border-radius:6px;padding:0 8px;font-weight:400;font-size:14px;white-space:nowrap}
.ks button.on{background:var(--rd);color:#fff}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.wc{padding:8px 12px}.wc small{margin:0}
small{color:#5b5566}
.bar{position:sticky;bottom:-14px;display:flex;gap:12px;justify-content:space-between;padding:14px 0 4px;margin-top:20px;background:linear-gradient(#0000,var(--pp) 40%)}
@media(max-width:700px){.mg{grid-template-columns:repeat(2,1fr)}.pg{grid-template-columns:1fr}}
</style></head><body>
<div id="w"><canvas id="c"></canvas>
<div class="sc" id="menu"><div class="box"><h1>STICK<br><span>ARENA</span></h1><p>Дуэли, боты, зомби-волны и боссы — вдвоём на одной клавиатуре</p><div class="mn"><button class="bt big" onclick="show('setup');rs()">PLAY</button><button class="bt" onclick="hlp()">Клавиши и оружие</button></div></div></div>

<div class="sc" id="help"><div class="box" id="hb"></div></div>
<div class="sc" id="end"><div class="box" style="text-align:center"><h1 id="et"></h1><p id="es"></p><div class="row" style="justify-content:center"><button class="bt big" onclick="play()">Ещё раз</button><button class="bt" onclick="menu()">В меню</button></div></div></div>
<div class="sc" id="pause"><div class="box" style="text-align:center"><h1>ПАУЗА</h1><div class="row" style="justify-content:center"><button class="bt big" onclick="pause()">Продолжить</button><button class="bt" onclick="menu()">В меню</button></div></div></div>
</div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),W=960,H=540,GY=500,R=Math.random,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),

{n:'Ледник',g:['#12304f','#8fd3f0'],h:'#1c4a72',d:'n',s:2,p:'#2d6a96',t:'#d9f4ff',pl:[[50,400,170],[740,400,170],[395,320,170],[190,215,150],[620,215,150]]},
{n:'Лава',g:['#1c0a0a','#8a2410'],h:'#2e100c',d:'e',s:3,p:'#4a1f18',t:'#ff7a3c',pl:[[70,380,200],[690,380,200],[380,290,200],[240,190,140],[580,190,140]]},
{n:'Ночь',g:['#060a1c','#1f2f66'],h:'#0d1431',d:'s',s:4,p:'#26305c',t:'#7f94e0',pl:[[0,380,230],[730,380,230],[330,300,300],[130,200,140],[690,200,140]]},
{n:'Лес',g:['#8fd6c4','#eaf6c8'],h:'#3f8a62',d:'l',s:5,p:'#2f6b4a',t:'#9be36a',pl:[[100,400,180],[680,400,180],[390,340,180],[250,240,160],[550,240,160],[400,140,160]]},
{n:'Мост',g:['#3a2a20','#d19a5a'],h:'#55392a',d:'o',s:6,p:'#6b4a35',t:'#f0c78a',pl:[[60,370,840],[260,235,440]]}];

let sc=1,M,G,ents=[],P=[],IT=[],PT=[],TX=[],RG=[],BM=[],bgc,K={},rb=null,cur='menu',lt=0;
const kn=c=>({ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',Space:'Пробел'})[c]||c.replace(/^(Key|Digit|Numpad)/,'');
const tn=t=>G.mode=='duel'?'ИГРОК '+(t+1):G.mode=='v12'?(t?'БОТЫ':'ИГРОК 1'):'КОМАНДА '+(t+1);
function fit(){const r=Math.min(innerWidth/W,innerHeight/H)*.97,d=devicePixelRatio||1;cv.style.width=W*r+'px';cv.style.height=H*r+'px';cv.width=W*r*d;cv.height=H*r*d;sc=r*d;if(M)mkbg()}
addEventListener('resize',fit);
function mkbg(){bgc=document.createElement('canvas');bgc.width=cv.width;bgc.height=cv.height;const c=bgc.getContext('2d');c.scale(sc,sc);
 let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,M.g[0]);g.addColorStop(1,M.g[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
 if(M.d=='o'||M.d=='s'){const o=M.d=='o';g=c.createRadialGradient(720,130,0,720,130,150);g.addColorStop(0,o?'#fff2c0':'#fffffff0');g.addColorStop(.25,o?'#ffc46bcc':'#cfe0ff55');g.addColorStop(1,'#0000');c.fillStyle=g;c.fillRect(500,0,460,330)}
 for(let k=0;k<2;k++){c.fillStyle=k?M.h:M.h+'77';c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=16)c.lineTo(x,(k?405:350)+Math.sin(x*.011+M.s*2+k*2)*36+Math.sin(x*.027+k)*12);c.lineTo(W,H);c.fill()}
 props(c);g=c.createLinearGradient(0,GY,0,H);g.addColorStop(0,M.p);g.addColorStop(1,'#000');c.fillStyle=g;c.fillRect(0,GY,W,H-GY);c.fillStyle=M.t;c.fillRect(0,GY,W,4);
 for(const p of M.pl){c.fillStyle='#0004';c.fillRect(p[0]+4,p[1]+14,p[2]-8,6);rr(p[0],p[1],p[2],14,M.p,c,6);rr(p[0],p[1],p[2],4,M.t,c,2)}}
function props(c){const d=M.d,q=i=>Math.abs(Math.sin(i*12.9898+M.s*7.3));
 if(d=='s'){for(let x=-10,i=0;x<W;x+=46,i++){const h=70+q(i)*150;c.fillStyle='#0a1028';c.fillRect(x,GY-h,40,h);c.fillStyle='#ffd86b';for(let y=GY-h+8;y<GY-12;y+=16)for(let k=0;k<3;k++)if(q(i*9+y+k)>.55)c.fillRect(x+6+k*11,y,6,8)}}
 else if(d=='n'||d=='l'){for(let x=20,i=0;x<W;x+=58,i++){const h=60+q(i)*70;c.fillStyle=d=='n'?'#cfeaf7':'#2a5c40';if(d=='n'){c.beginPath();c.moveTo(x-22,GY);c.lineTo(x,GY-h);c.lineTo(x+22,GY);c.fill()}else{c.fillRect(x-3,GY-h*.4,6,h*.4);c.beginPath();c.arc(x,GY-h*.6,h*.38,0,7);c.fill()}}}
 else if(d=='e'){c.fillStyle='#120606';for(let x=0,i=0;x<W;x+=70,i++){const h=80+q(i)*120;c.beginPath();c.moveTo(x,GY);c.lineTo(x+35,GY-h);c.lineTo(x+70,GY);c.fill()}}
 else{c.fillStyle='#3a2410';for(let x=60,i=0;x<W;x+=190,i++){const h=110+q(i)*90;c.fillRect(x,GY-h,26,h);c.fillRect(x-6,GY-h,38,10)}}}

 cx.globalAlpha=a*.8;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}cx.globalAlpha=1}

 fx(o.x,o.y-o.h*.6,Math.min(10,3+d/8|0),o.z?'#8fd16a':o.c,170);spark(o.x,o.y-o.h*.6,Math.min(9,3+d/9|0),'#fff3b0');if(d>=40&&!G.demo)G.hs=.05;TX.push({x:o.x+(R()-.5)*20,y:o.y-o.h-8,t:'-'+d,l:.8,c:fz?'#9fe3ff':'#fff'});if(o.hp<=0)die(o)}

 for(const o of ents)if(o.hp>0&&o.tm!=e.tm&&(o.x-x)*e.f>0&&y>o.y-o.h-8&&y<o.y+4)hit(o,dm,e,e.f*380);use(e)}
