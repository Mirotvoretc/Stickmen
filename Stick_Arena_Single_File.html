:root{--bg:#0f1320;--pn:#181e33;--ln:#2c3556;--tx:#f1f3fa;--mu:#8e98b8;--ac:#ffb62e;--rd:#ff4d5e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#w{position:relative;height:100%;display:grid;place-items:center}
canvas{border-radius:12px;box-shadow:0 0 0 2px #000,0 18px 60px #000a}
.sc{position:absolute;inset:0;display:none;overflow:auto;padding:14px;background:#0a0d18d9;backdrop-filter:blur(5px)}
.sc.on{display:flex}
.box{margin:auto;width:100%;max-width:880px}
h1,h2,h3,.bt{font-family:'Russo One',Impact,'Arial Black',sans-serif;font-weight:400;letter-spacing:.02em}
h1{font-size:clamp(40px,8vw,84px);line-height:.95;margin:0 0 8px;text-align:center;text-shadow:4px 4px 0 var(--rd),8px 8px 0 #000}

h2{font-size:13px;color:var(--mu);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.12em}
h3{margin:0;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.bt,.ch,select,.ks button{font:inherit;border:2px solid #000;border-radius:10px;background:var(--pn);color:var(--tx);padding:9px 14px;cursor:pointer;box-shadow:0 3px 0 #000}
.bt{font-family:'Russo One',Impact,sans-serif}
.bt:active,.ch:active{transform:translateY(3px);box-shadow:none}
.bt.big{font-size:22px;padding:14px 34px;background:var(--ac);color:#1a1200}
.ch.on{background:var(--ac);color:#1a1200;font-weight:700}
.pn{flex:1;min-width:260px;background:var(--pn);border:2px solid #000;border-radius:14px;padding:12px;box-shadow:0 4px 0 #000}
.sw{display:flex;gap:6px;margin:10px 0}.sw i{width:26px;height:26px;border-radius:50%;border:3px solid #000;cursor:pointer}.sw i.on{outline:3px solid #fff}
.ks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.ks button{padding:6px 8px;font-size:13px}.ks button.on{background:var(--rd)}
small{color:var(--mu);display:block;margin-top:5px}
.mn{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:20px}
table{border-collapse:collapse;width:100%}td{padding:5px 8px;border-bottom:1px solid var(--ln)}
.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
:root{--ink:#17141c;--pp:#f4ecd6;--ac:#ffcf3a;--rd:#ff4d5e;--gr:#4ade80}
.sc{background:repeating-linear-gradient(0deg,#0000 0 31px,#7aa7c733 31px 32px),repeating-linear-gradient(90deg,#0000 0 31px,#7aa7c733 31px 32px),var(--pp);color:var(--ink);backdrop-filter:none;font-family:Neucha,'Comic Sans MS',system-ui,sans-serif;font-size:19px}
#menu{background:linear-gradient(100deg,#07090fef 0,#07090fb0 45%,#0000 85%);color:#fff}
#menu .box{margin:auto auto auto 7vw}
#menu h1{text-align:left;color:#fff;font-size:clamp(46px,9vw,110px);transform:rotate(-3deg);text-shadow:5px 5px 0 var(--rd),10px 10px 0 #000}
#menu p{margin:10px 0 0;font-size:21px;color:#ffeab0;text-align:left}
.mn{align-items:flex-start}
.sc:not(#menu) h1{color:var(--ink);text-shadow:4px 4px 0 var(--ac)}
h2{color:var(--ink);font-size:17px;margin:22px 0 10px;text-transform:none;letter-spacing:0;display:flex;gap:10px;align-items:center}
h2 b{background:var(--ink);color:var(--pp);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:15px}
.bt,.ch,.ks button,.pn,.mc,.wc{border:3px solid var(--ink);border-radius:14px 5px 13px 6px/6px 13px 5px 14px;background:#fff;color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.bt:hover,.ch:hover{transform:translate(-1px,-2px) rotate(-.6deg)}
.bt:active,.ch:active{transform:translate(3px,3px);box-shadow:none}
.bt.big{background:var(--ac);font-size:24px;padding:14px 38px}
.ch.on{background:var(--ac)}
.ch.s{padding:4px 10px;font-size:16px;box-shadow:2px 2px 0 var(--ink)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.mc{position:relative;padding:8px 8px 4px;cursor:pointer;text-align:center;transition:.15s;filter:grayscale(.9);opacity:.72}
.mc:nth-child(odd){transform:rotate(-1.3deg)}.mc:nth-child(even){transform:rotate(1.1deg)}
.mc:hover{opacity:.95}
.mc.on{filter:none;opacity:1;background:#fffbe6}
.mc.on::after{content:'✓';position:absolute;right:-10px;top:-12px;background:var(--gr);border:3px solid var(--ink);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:700}
.mc::before{content:'';position:absolute;left:38%;top:-11px;width:24%;height:18px;background:#ffe29aaa;border:1px solid #0002;transform:rotate(-3deg)}
.mc img{width:100%;display:block;border:2px solid var(--ink);border-radius:4px;aspect-ratio:16/9}
.mc span{font-family:'Russo One',Impact,sans-serif;font-size:15px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pn{display:flex;gap:12px;align-items:flex-start;background:#fffdf6;padding:14px;min-width:0;flex:none}
.pn>div{flex:1;min-width:0}
.pv{width:96px;flex:none}
.sw i{border:3px solid var(--ink)}
.ks button{padding:5px 8px;font-size:15px;box-shadow:2px 2px 0 var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:center}
.ks button b{background:var(--ink);color:#fff;border-radius:6px;padding:0 8px;font-weight:400;font-size:14px;white-space:nowrap}
.ks button.on{background:var(--rd);color:#fff}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.wc{padding:8px 12px}.wc small{margin:0}
small{color:#5b5566}
.bar{position:sticky;bottom:-14px;display:flex;gap:12px;justify-content:space-between;padding:14px 0 4px;margin-top:20px;background:linear-gradient(#0000,var(--pp) 40%)}
@media(max-width:700px){.mg{grid-template-columns:repeat(2,1fr)}.pg{grid-template-columns:1fr}}

 if(G.bt>0&&G.bn){cx.globalAlpha=Math.min(1,G.bt*2);cx.font='60px '+F;cx.lineWidth=8;cx.lineJoin='round';cx.strokeStyle='#000';cx.strokeText(G.bn,W/2,H/2-20);cx.fillStyle='#ffb62e';cx.fillText(G.bn,W/2,H/2-20)}
 cx.restore()}

</script>
<script>

 try{if(G.hs>0){G.hs-=dt;dt=0}else if(G.slow>0){G.slow-=dt;dt*=.35}step(dt);er=0}catch(x){console.error(x);if(++er>3){er=0;try{G.hs=0;G.slow=0;nextRound()}catch(y){startMatch(1)}}}
 try{draw()}catch(x){console.error(x);cv.width=cv.width;PT=[];TX=[];RG=[];BM=[]}}

 pn=i=>{const p=S.p[i];return `<div class="pn"><img class="pv" src="${pv(i)}"><div><h3>Игрок ${i+1}</h3><div class="sw">${COL.map((c,j)=>`<i class="${p.c==j?'on':''}" style="background:${c}" onclick="S.p[${i}].c=${j};rs()"></i>`).join('')}</div><div class="row">${CH.map((c,j)=>`<button class="ch s ${p.ch==j?'on':''}" onclick="S.p[${i}].ch=${j};rs()">${c.n}</button>`).join('')}</div><small>${CH[p.ch].d}</small>${kb(i)}</div></div>`};

 pn=i=>{const p=S.p[i];return `<div class="pn"><h3>Игрок ${i+1} · ${i?'стрелки':'WASD'}</h3><div class="sw">${COL.map((c,j)=>`<i class="${p.c==j?'on':''}" style="background:${c}" onclick="S.p[${i}].c=${j};rs()"></i>`).join('')}</div><select onchange="S.p[${i}].ch=+this.value;rs()">${CH.map((c,j)=>`<option value="${j}" ${p.ch==j?'selected':''}>${c.n}</option>`).join('')}</select><small>${CH[p.ch].d}</small><div class="ks">${ACT.map(a=>{const on=rb&&rb[0]==i&&rb[1]==a[0];return `<button class="${on?'on':''}" onclick="rebind(${i},'${a[0]}')">${a[1]}: <b>${on?'нажми…':kn(p.k[a[0]])}</b></button>`}).join('')}</div></div>`};
 $('sb').innerHTML=`<h2>Режим</h2><div class="row">${Object.entries(MD).map(([k,n])=>`<button class="ch ${S.mode==k?'on':''}" onclick="S.mode='${k}';rs()">${n}</button>`).join('')}</div>${v?`<h2>Раундов (выигрывает большинство)</h2><div class="row">${[1,3,5,7].map(n=>`<button class="ch ${S.rounds==n?'on':''}" onclick="S.rounds=${n};rs()">${n}</button>`).join('')}</div>`:''}<h2>Карты: выбери несколько, они сменяются случайно</h2><div class="row">${MP.map((m,j)=>`<button class="ch ${S.maps.includes(j)?'on':''}" onclick="tg(${j})">${m.n}</button>`).join('')}</div><h2>Стикмены</h2><div class="row">${pn(0)}${pn(1)}</div><p class="row"><button class="bt" onclick="show('menu')">Назад</button><button class="bt" onclick="hlp()">Управление</button><button class="bt big" onclick="play()">В БОЙ</button></p>`}

 $('hb').innerHTML=`<h2>Управление</h2><table><tr><td></td>${ACT.map(a=>`<td><b>${a[1]}</b></td>`).join('')}</tr><tr><td>Игрок 1</td>${kt(0)}</tr><tr><td>Игрок 2</td>${kt(1)}</tr></table><small>Клавиши меняются в настройках перед боем. Esc — пауза. Оружие падает с неба — подбери касанием. Пистолет бесконечный.</small><h2>Оружие</h2><table>${Object.values(WP).map(w=>`<tr><td><i class="dt" style="background:${w.c}"></i>${w.n}</td><td>${w.d}</td></tr>`).join('')}</table><h2>Персонажи</h2><table>${CH.map(c=>`<tr><td>${c.n}</td><td>${c.d}</td></tr>`).join('')}</table><p><button class="bt" onclick="show('${f}')">Назад</button></p>`;show('help')}
